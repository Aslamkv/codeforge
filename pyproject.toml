[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
filterwarnings = [
    # Tinker's own TestRef, TestWriter and TestTool are not test classes
    "ignore:cannot collect test class:pytest.PytestCollectionWarning",
]
markers = [
    "spec(id): the SPEC.md point a test enforces",
]
