[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-p no:cacheprovider -n auto"
markers = [
    "spec(id): the SPEC.md point a test enforces",
]

[tool.ruff]
line-length = 110
target-version = "py315"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501", "E731", "B904", "B905", "B911"]

[tool.ruff.lint.per-file-ignores]
"tinker.py" = ["UP036"]
